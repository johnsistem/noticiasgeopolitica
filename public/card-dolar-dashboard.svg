<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Dashboard financiero global de la era post-dólar" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5f1c"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3dd8a"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg2)"/>

  <!-- Header HUD -->
  <text x="24" y="34" fill="#e11d48" font-size="13" font-weight="700" letter-spacing="2">▲ SISTEMA MONETARIO GLOBAL · 2026</text>
  <text x="24" y="56" fill="#f5f7fa" font-size="22" font-weight="700">EL FIN DE LA ERA DEL DÓLAR</text>
  <text x="24" y="74" fill="#8b98ab" font-size="12">Deuda · Oro · Desdolarización — datos sep-2026</text>

  <!-- Tarjeta grande: Deuda -->
  <rect x="24" y="92" width="552" height="100" rx="10" fill="#12294d" stroke="#2f6fb0" stroke-width="1"/>
  <text x="42" y="118" fill="#7ca8d9" font-size="12" font-weight="600" letter-spacing="1">DEUDA PÚBLICA DE EE. UU. · DATO OFICIAL AL DÍA</text>
  <text x="42" y="156" fill="#fca5a5" font-size="42" font-weight="800">$40,05 B</text>
  <text x="42" y="178" fill="#8b98ab" font-size="11">U.S. Treasury · Debt to the Penny · 10-sep-2026</text>
  <!-- Barra deuda/deuda-permitida fake: relleno 84% -->
  <rect x="330" y="130" width="230" height="16" rx="8" fill="#1a2333"/>
  <rect x="330" y="130" width="193" height="16" rx="8" fill="url(#redBar)"/>
  <text x="330" y="124" fill="#f5f7fa" font-size="11" font-weight="700">$32,36 B</text>
  <text x="330" y="166" fill="#8b98ab" font-size="10">en manos del público</text>

  <!-- Sparkline del oro -->
  <rect x="24" y="208" width="552" height="130" rx="10" fill="#101a2e" stroke="#d4af37" stroke-opacity="0.5" stroke-width="1"/>
  <text x="42" y="232" fill="#d4af37" font-size="12" font-weight="700" letter-spacing="1">ORO · MÁXIMO HISTÓRICO</text>
  <text x="42" y="260" fill="#f5f7fa" font-size="30" font-weight="800">$5.405 /oz</text>
  <text x="42" y="280" fill="#8b98ab" font-size="11">pico ene-2026 · spot ~$4.327 · WGC</text>
  <!-- Sparkline -->
  <polyline fill="none" stroke="url(#goldLine)" stroke-width="3" stroke-linejoin="round" points="330,292 358,300 386,288 414,294 442,268 470,252 498,256 526,226 554,222 556,214"/>
  <circle cx="556" cy="214" r="5" fill="#d4af37"/>

  <!-- Tarjeta tenencias China -->
  <rect x="24" y="342" width="270" height="46" rx="8" fill="#101a2e" stroke="#e11d48" stroke-opacity="0.5"/>
  <text x="38" y="362" fill="#8b98ab" font-size="11">CHINA · BONOS TESORO (TIC jun-26)</text>
  <text x="38" y="380" fill="#fca5a5" font-size="18" font-weight="700">$633,4 miles de M ▼</text>

  <!-- Tarjeta compras oro -->
  <rect x="306" y="342" width="270" height="46" rx="8" fill="#101a2e" stroke="#d4af37" stroke-opacity="0.5"/>
  <text x="320" y="362" fill="#8b98ab" font-size="11">BANCOS CENTRALES · 2025</text>
  <text x="320" y="380" fill="#f3dd8a" font-size="18" font-weight="700">+863 t de oro ▲</text>
</svg>