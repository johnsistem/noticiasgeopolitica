<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Mapa táctico del estrecho de Bab el-Mandeb" font-family="Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bgw" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <pattern id="gridw" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16325a" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#2f6fb0" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bgw)"/>
  <rect width="600" height="400" fill="url(#gridw)" opacity="0.55"/>

  <!-- Header -->
  <text x="24" y="34" fill="#10b981" font-size="13" font-weight="700" letter-spacing="2">● SECTOR YEMEN-PERIM · MAR ROJO</text>
  <text x="24" y="54" fill="#f5f7fa" font-size="20" font-weight="700">ANÁLISIS BAB EL-MANDEB</text>

  <!-- Yemen (arriba derecha) -->
  <path d="M 360 70 L 600 70 L 600 250 Q 540 230 480 250 Q 420 260 400 300 L 360 300 Z" fill="#101a2e" stroke="#2f6fb0" stroke-width="1.5"/>
  <text x="420" y="120" fill="#5fa0da" font-size="11">YEMEN</text>

  <!-- África (abajo izquierda) -->
  <path d="M 0 240 Q 90 260 140 320 Q 190 380 120 400 L 0 400 Z" fill="#101a2e" stroke="#2f6fb0" stroke-width="1.5"/>
  <text x="30" y="360" fill="#5fa0da" font-size="11">YIBUTI / ERITREA</text>

  <!-- Perim -->
  <ellipse cx="300" cy="240" rx="26" ry="16" fill="#1c3b63" stroke="#d4af37" stroke-width="2"/>
  <text x="300" y="228" fill="#d4af37" font-size="9" text-anchor="middle" font-weight="700">ISLA DE PERIM</text>

  <!-- Rutas marítimas -->
  <path d="M 120 120 Q 240 180 300 300" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M 90 150 Q 200 210 290 330" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6" opacity="0.8"/>

  <!-- Anillos de radar centrados en Perim -->
  <circle cx="300" cy="240" r="70" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="300" cy="240" r="120" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 6" opacity="0.25"/>

  <!-- Vehículos/buques -->
  <circle cx="380" cy="180" r="4" fill="#e11d48"/>
  <circle cx="210" cy="300" r="4" fill="#e11d48"/>
  <circle cx="340" cy="280" r="3" fill="#f59e0b"/>

  <!-- Footer telemetría -->
  <rect x="24" y="344" width="552" height="40" rx="8" fill="#0f1524" stroke="#2f6fb0" stroke-opacity="0.6"/>
  <text x="40" y="362" fill="#8b98ab" font-size="11">GEO: 12.65° N / 43.41° E</text>
  <text x="40" y="377" fill="#5fa0da" font-size="10">RADAR AIS ACTIVO · 3 CONTACTOS NO IDENTIFICADOS</text>
  <text x="470" y="370" fill="#10b981" font-size="11" font-weight="700">● LIVE</text>
</svg>