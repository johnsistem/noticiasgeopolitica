<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Lluvia de misiles balísticos sobre la base de Sharurah" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#2a1623"/>
      <stop offset="100%" stop-color="#3d1f1a"/>
    </linearGradient>
    <linearGradient id="missile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9aa6b8"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <radialGradient id="boom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffdd55"/>
      <stop offset="60%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boom2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="35%" stop-color="#ffb020"/>
      <stop offset="70%" stop-color="#ff5c2a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- Header HUD -->
  <text x="24" y="34" fill="#ff7b00" font-size="13" font-weight="700" letter-spacing="2">▲ OFENSIVA BALÍSTICA EN CURSO</text>
  <text x="24" y="56" fill="#f5f7fa" font-size="21" font-weight="800">LLUVIA DE MISILES · BASE SHARURAH</text>
  <text x="24" y="74" fill="#c9a9a9" font-size="11">Hutíes de Yemen · misiles balísticos + enjambres de drones</text>

  <!-- Trayectorias balísticas (arcos) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 60 320 Q 180 60 300 150 Q 420 240 480 300" stroke="#ffb020" stroke-width="2.5" stroke-dasharray="2 6" filter="url(#glow)" opacity="0.9"/>
    <path d="M 40 300 Q 160 90 290 160 Q 430 230 500 280" stroke="#ff6b35" stroke-width="2" stroke-dasharray="2 7" opacity="0.8"/>
    <path d="M 80 340 Q 200 120 320 140 Q 440 220 520 310" stroke="#ffd166" stroke-width="2" stroke-dasharray="2 6" opacity="0.7"/>
  </g>

  <!-- Misiles en vuelo (puntas) -->
  <g>
    <!-- Misil 1 -->
    <g transform="translate(340 120) rotate(-40)">
      <polygon points="0,0 10,26 -10,26" fill="url(#missile)" stroke="#0a0f1e" stroke-width="1"/>
      <rect x="-2" y="22" width="4" height="8" fill="#ff7b00"/>
      <rect x="-6" y="30" width="12" height="10" fill="#ff3b30"/>
    </g>
    <!-- Misil 2 -->
    <g transform="translate(430 230) rotate(-55)">
      <polygon points="0,0 12,30 -12,30" fill="url(#missile)" stroke="#0a0f1e" stroke-width="1"/>
      <rect x="-2.5" y="26" width="5" height="9" fill="#ff7b00"/>
      <rect x="-7" y="35" width="14" height="12" fill="#ff3b30"/>
    </g>
  </g>

  <!-- Drones (pequeños triángulos naranja) -->
  <g fill="#ff6b35">
    <path d="M 120 210 l6 12 -12 0 z"/>
    <path d="M 170 180 l5 10 -10 0 z"/>
    <path d="M 100 250 l5 10 -10 0 z"/>
  </g>

  <!-- Base objetivo: Sharurah -->
  <g>
    <rect x="230" y="330" width="140" height="46" rx="6" fill="#131a2a" stroke="#ff5c2a" stroke-width="1.5"/>
    <text x="300" y="350" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">BASE MILITAR</text>
    <text x="300" y="366" fill="#f5f7fa" font-size="10" text-anchor="middle">SHARURAH · SAUDI ARABIA</text>
  </g>

  <!-- Explosiones en el objetivo -->
  <circle cx="300" cy="330" r="46" fill="url(#boom)" opacity="0.95"/>
  <circle cx="300" cy="330" r="26" fill="url(#boom2)" opacity="0.95"/>
  <circle cx="340" cy="334" r="22" fill="url(#boom2)" opacity="0.8"/>
  <circle cx="264" cy="336" r="18" fill="url(#boom2)" opacity="0.7"/>

  <!-- Humo -->
  <g fill="#3a3230" opacity="0.55">
    <circle cx="250" cy="356" r="10"/>
    <circle cx="262" cy="368" r="14"/>
    <circle cx="340" cy="360" r="12"/>
    <circle cx="352" cy="372" r="16"/>
  </g>

  <!-- Warning blinkers -->
  <rect x="430" y="344" width="146" height="40" rx="8" fill="#1a0f14" stroke="#ff3b30" stroke-width="1"/>
  <text x="444" y="361" fill="#ff8a80" font-size="10">TENSION: CRÍTICA</text>
  <text x="444" y="377" fill="#ffcf4d" font-size="10" font-weight="700">▲ MISILES BALLÍSTICOS</text>
  <circle cx="560" cy="360" r="5" fill="#ff3b30" opacity="0.9">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>